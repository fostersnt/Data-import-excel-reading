    # sudo a2ensite 000-default.conf
services:
    app:
        build:
            context: .
            dockerfile: Dockerfile
        volumes:
            - .:/usr/local/apache2/htdocs
        networks:
            - app-network

    webserver:
        image: httpd:latest
        volumes:
            - ./httpd.conf:/usr/local/apache2/conf/httpd.conf
            - .:/usr/local/apache2/htdocs
        ports:
            - "8000:80"
        networks:
            - app-network
        depends_on:
            - app

    mysql:
        image: mysql:8
        environment:
            MYSQL_DATABASE: ${DB_DATABASE}
            MYSQL_USER: ${DB_USERNAME}
            MYSQL_PASSWORD: ${DB_PASSWORD}
            MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
        volumes:
            - mysql_data:/var/lib/mysql
        networks:
            - app-network

networks:
    app-network:
        driver: bridge

volumes:  # Add this section to define your volumes
    mysql_data:
