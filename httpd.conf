# Load necessary modules
LoadModule rewrite_module modules/mod_rewrite.so

# Set the document root to Laravel's public directory
DocumentRoot "/usr/local/apache2/htdocs/public"

<Directory "/usr/local/apache2/htdocs/public">
    AllowOverride All  # Allow .htaccess overrides
    Require all granted  # Allow access to the directory
</Directory>

# Optionally, configure a virtual host
<VirtualHost *:80>
    ServerAdmin webmaster@localhost
    DocumentRoot "/usr/local/apache2/htdocs/public"
    ServerName localhost

    <Directory "/usr/local/apache2/htdocs/public">
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog logs/error.log
    CustomLog logs/access.log common
</VirtualHost>
